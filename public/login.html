<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to TaskFlow</title>
  <meta name="description" content="Access your personal TaskFlow workspace.">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api.js" defer></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card" id="login-card">
      <div class="auth-header">
        <a href="/index.html" class="logo-container">
          <div class="logo-icon">T</div>
          <span>TaskFlow</span>
        </a>
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access your tasks</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Sign up for free</a>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
